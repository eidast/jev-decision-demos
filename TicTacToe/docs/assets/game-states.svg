<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Tic Tac Toe with Jev: welcome, move selection, and tie</title>
<desc id="desc">Three schematic panels show mark selection, a board where minimax offers cells 2 and 6 to Jev, and a completed tie with replay.</desc>
<rect width="1200" height="590" fill="#121b28"/>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #f7f5f0; }
  .eyebrow { fill: #d5ed88; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
  .heading { font-size: 27px; font-weight: 750; }
  .body { fill: #c6ccd4; font-size: 15px; }
  .small { fill: #aebbc9; font-size: 12px; }
  .mark { font-size: 38px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
  .x { fill: #d5ed88; }
  .o { fill: #f1a38d; }
  .index { fill: #8090a2; font-size: 12px; text-anchor: end; }
</style>

<rect x="30" y="32" width="360" height="526" rx="20" fill="#1b2737" stroke="#475568"/>
<text class="eyebrow" x="55" y="72">01 / WELCOME</text>
<rect x="420" y="32" width="360" height="526" rx="20" fill="#1b2737" stroke="#475568"/>
<text class="eyebrow" x="445" y="72">02 / JEV DECISION</text>
<rect x="810" y="32" width="360" height="526" rx="20" fill="#1b2737" stroke="#475568"/>
<text class="eyebrow" x="835" y="72">03 / TIE</text>
<text class="heading" x="55" y="126">Your move.</text>
<text class="heading x" x="55" y="160">Jev’s next.</text>
<text class="body" x="55" y="204">Choose your mark.</text>
<text class="body" x="55" y="231">X always plays first.</text>
<rect x="55" y="270" width="145" height="138" rx="14" fill="#2a394d" stroke="#65748a"/>
<rect x="216" y="270" width="145" height="138" rx="14" fill="#2a394d" stroke="#65748a"/>
<text class="mark x" x="127" y="325">X</text>
<text class="mark x" x="288" y="325">O</text>
<text class="small" x="93" y="381">You start</text>
<text class="small" x="250" y="381">Jev starts</text>
<text class="small" x="55" y="488">Pick X or O to create a game.</text>
<text class="heading" x="445" y="125">Only safe moves</text>
<text class="body" x="445" y="155">Board: O · · / · X · / · · X</text>

<rect x="445" y="190" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark o" x="479.5" y="225">O</text>
<rect x="522" y="190" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="index" x="583" y="208">1</text>
<rect x="599" y="190" width="69" height="69" rx="10" fill="#344552" stroke="#d5ed88"/>
<text class="index" x="660" y="208">2</text>
<rect x="445" y="267" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="index" x="506" y="285">3</text>
<rect x="522" y="267" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark x" x="556.5" y="302">X</text>
<rect x="599" y="267" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="index" x="660" y="285">5</text>
<rect x="445" y="344" width="69" height="69" rx="10" fill="#344552" stroke="#d5ed88"/>
<text class="index" x="506" y="362">6</text>
<rect x="522" y="344" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="index" x="583" y="362">7</text>
<rect x="599" y="344" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark x" x="633.5" y="379">X</text>
<text class="body" x="445" y="455">Minimax: cell 2 = 0, cell 6 = 0</text>
<text class="small" x="445" y="485">Jev chooses one offered cell.</text>
<text class="heading" x="835" y="125">It’s a tie.</text>
<text class="body" x="835" y="155">Nine squares; no winning line.</text>

<rect x="835" y="190" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark o" x="869.5" y="225">O</text>
<rect x="912" y="190" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark x" x="946.5" y="225">X</text>
<rect x="989" y="190" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark o" x="1023.5" y="225">O</text>
<rect x="835" y="267" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark o" x="869.5" y="302">O</text>
<rect x="912" y="267" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark x" x="946.5" y="302">X</text>
<rect x="989" y="267" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark x" x="1023.5" y="302">X</text>
<rect x="835" y="344" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark x" x="869.5" y="379">X</text>
<rect x="912" y="344" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark o" x="946.5" y="379">O</text>
<rect x="989" y="344" width="69" height="69" rx="10" fill="#2b3b4d" stroke="#516179"/>
<text class="mark x" x="1023.5" y="379">X</text>
<rect x="835" y="444" width="230" height="58" rx="13" fill="#d5ed88"/>
<text x="897" y="481" style="fill:#192536;font-size:18px;font-weight:750">Play again</text>
<text class="small" x="30" y="580">Schematic UI states based on the implemented interface and a controlled local tie. Not a captured screenshot.</text>
</svg>
